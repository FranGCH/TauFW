## Config file for default TES fit in mutau channel
##

channel: mumu
tag: "_mumu"

samples:
    filename: "$PICODIR/$SAMPLE_$CHANNEL$TAG.root"
    join: ["VV","TT","ST"]
    rename:
        WJ: "W"
        DY: "ZTT"
    data: "data_obs"

baselineCuts: "q_1*q_2<0 && iso_1<0.15 && iso_2<0.15 && !lepton_vetoes && metfilter"

# regions:
#     ZMM: 
#         definition: "q_1*q_2<0"
#         title: "Z→μμ"

observables:
    m_vis:
        binning: [18, 20, 200] 
        extra:
            ymargin: 1.6
            rrange: 0.08
        fitRegions: ["baseline"]

processes: ['ZTT','ZL', 'ZJ','W','VV','ST','TTT', 'TTL', 'TTJ','QCD','data_obs']

systematics:
    lumi:
        effect: "lnN"
        processes: ["ZTT", "ZL", "ZJ", "TTT", "TTL", "TTJ", "W", "ST", "VV"]
        scaleFactor: 1.025
    eff_m:
        effect: "lnN"
        processes: ["ZTT", "ZL", "ZJ", "TTT", "TTL", "TTJ", "W", "ST", "VV"]
        scaleFactor: 1.02
    xsec_dy:
        effect: "lnN"
        processes: ["ZTT", "ZL", "ZJ"]
        scaleFactor: 1.02
